services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - finbot_network

  postgres:
    image: postgres:15-alpine
    container_name: finbot-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - finbot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  finbot-backend:
    container_name: finbot-backend
    build:
      context: .
      dockerfile: Docker/Dockerfile-backend.Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port ${PORT} --reload --log-level info
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROJECT_NAME: ${PROJECT_NAME}
      CORS_ORIGINS: "*"
    env_file:
      - .env
    depends_on:
      - clickhouse
      - postgres
    networks:
      - finbot_network


  ngrok:
    image: ngrok/ngrok:latest
    platform: linux/amd64
    command: ["http", "finbot-backend:${PORT}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - finbot-backend
    networks:
      - finbot_network
    ports:
      - "4040:4040"


networks:
  finbot_network:
    driver: bridge

volumes:
  clickhouse_data:
  postgres_data:
