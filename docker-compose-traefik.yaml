services:
  # Traefik reverse proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.api.address=:8000"
    ports:
      - "8080:8080"  # Traefik web entrypoint
      - "8090:8080"  # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - weathernetwork

  # ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=${WEATHER_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - weathernetwork

  # Weather Backend Service
  weather-backend:
    container_name: weather-backend
    build:
      context: .
      dockerfile: Docker/Dockerfile-backend.Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info
    ports:
      - "8000:8000"  # Direct access for testing
    expose:
      - "8000"  # For Traefik
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${WEATHER_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      WEATHERAPI_KEY: ${WEATHER_API_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: "*"
    depends_on:
      - clickhouse
    networks:
      - weathernetwork
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Weather API routes
      - "traefik.http.routers.weather-api.rule=Host(`localhost`) && PathPrefix(`/api/v1/weather`)"
      - "traefik.http.routers.weather-api.entrypoints=web"
      - "traefik.http.routers.weather-api.service=weather-api"
      - "traefik.http.services.weather-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.weather-api.middlewares=weather-stripprefix,weather-cors"
      
      # Strip prefix middleware
      - "traefik.http.middlewares.weather-stripprefix.stripprefix.prefixes=/api/v1/weather"
      
      # CORS middleware
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.weather-cors.headers.addvaryheader=true"
      
      # Health check route (direct access)
      - "traefik.http.routers.weather-health.rule=Host(`localhost`) && Path(`/health`)"
      - "traefik.http.routers.weather-health.entrypoints=web"
      - "traefik.http.routers.weather-health.service=weather-health"
      - "traefik.http.services.weather-health.loadbalancer.server.port=8000"

networks:
  weathernetwork:
    driver: bridge

volumes:
  clickhouse_data:
