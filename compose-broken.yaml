services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=${WEATHER_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - weathernetwork

  backend_service:
    container_name: weather-backend
    build:
      context: .
      dockerfile: Docker/Dockerfile-backend.Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${WEATHER_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      WEATHERAPI_KEY: ${WEATHER_API_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: "*"
    depends_on:
      - clickhouse
    networks:
      - weathernetwork
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # HTTP Router for weather API
      - "traefik.http.routers.weather-api.rule=Host(`weather.localhost`) && PathPrefix(`/api/v1/weather`)"
      - "traefik.http.routers.weather-api.service=weather-api"
      - "traefik.http.services.weather-api.loadbalancer.server.port=8000"
      
      # Strip prefix middleware
      - "traefik.http.routers.weather-api.middlewares=weather-stripprefix"
      - "traefik.http.middlewares.weather-stripprefix.stripprefix.prefixes=/api/v1/weather"
      
      # Health check router (direct access)
      - "traefik.http.routers.weather-health.rule=Host(`weather.localhost`) && Path(`/health`)"
      - "traefik.http.routers.weather-health.service=weather-health"
      - "traefik.http.services.weather-health.loadbalancer.server.port=8000"
      
      # CORS middleware
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.weather-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.weather-cors.headers.addvaryheader=true"
    depends_on:
      - clickhouse
    networks:
      - weathernetwork


networks:
  weathernetwork:
    driver: bridge

volumes:
  clickhouse_data:
